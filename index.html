<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 Not Found</title>
<style>
body {
margin: 0;
padding: 0;
font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
background-color: #121212;
color: #ffffff;
text-align: center;
} 

.error-section {
height: 100vh;
display: flex;
flex-direction: column;
justify-content: center;
align-items: center;
padding: 20px;
box-sizing: border-box;
} 

.error-code {
font-size: 72px;
font-weight: bold;
color: #ff4d4d;
margin: 0;
} 

.error-title {
font-size: 24px;
margin-top: 10px;
} 

.scroll-hint {
margin-top: 50px;
font-size: 14px;
color: #888;
animation: bounce 2s infinite;
} 

@keyframes bounce {
0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
40% { transform: translateY(-10px); }
60% { transform: translateY(-5px); }
} 

.question-section {
min-height: 100vh;
display: flex;
flex-direction: column;
justify-content: center;
align-items: center;
padding: 20px;
box-sizing: border-box;
background-color: #1e1e1e;
} 

.card {
background: #2a2a2a;
padding: 30px;
border-radius: 16px;
box-shadow: 0 8px 24px rgba(0,0,0,0.5);
max-width: 350px;
width: 100%;
} 

h2 {
margin-top: 0;
font-size: 26px;
} 

.btn-group {
display: flex;
gap: 15px;
justify-content: center;
margin-top: 25px;
} 

button {
padding: 12px 24px;
font-size: 16px;
font-weight: bold;
border: none;
border-radius: 8px;
cursor: pointer;
transition: transform 0.2s, background-color 0.2s;
} 

button:hover {
transform: scale(1.05);
} 

.btn-yes {
background-color: #2ed573;
color: white;
} 

.btn-no {
background-color: #ff4757;
color: white;
} 

.response-message {
margin-top: 20px;
font-size: 18px;
font-weight: 500;
line-height: 1.4;
display: none;
}
</style>
</head>
<body> 

<!-- TELA 1: ERRO 404 -->
<div class="error-section">
  <h1 class="error-code">404</h1>
  <p class="error-title">Erro: Surpresa não encontrada! 🙈</p>
  <div class="scroll-hint">
    Espera lá... desliza para baixo 👇
  </div>
</div>

<!-- TELA 2: MENSAGEM E OPÇÕES -->
<div class="question-section">
  <div class="card">
    <h2 id="question-text">Ainda queres? 😏</h2>

    <div class="btn-group" id="btn-group">
      <button class="btn-yes" onclick="responder('Sim')">Sim</button>
      <button class="btn-no" onclick="responder('Não')">Não</button>
    </div>

    <p class="response-message" id="response-text"></p>
  </div>
</div>

<script>
function responder(opcao) {
  const btnGroup = document.getElementById('btn-group');
  const responseText = document.getElementById('response-text'); 

  btnGroup.style.display = 'none'; 

  responseText.style.display = 'block';
  if (opcao === 'Sim') {
    responseText.innerHTML = "Perfeito, era a resposta que estava à espera 😉";
    responseText.style.color = "#2ed573";
  } else {
    responseText.innerHTML = "Ok. In any case, it was the last attempt.";
    responseText.style.color = "#ffa502";
  } 

  fetch("https://formspree.io/f/mykraybv", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Accept": "application/json"
    },
    body: JSON.stringify({
      resposta: opcao,
      data_hora: new Date().toLocaleString("pt-PT")
    })
  });
}
</script> 

</body>
</html>
